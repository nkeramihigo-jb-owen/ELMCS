<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>ELMCS | Submit Request</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, sans-serif;
        background: #f4f6f8;
        color: #333;
    }

    .navbar {
        background: #1f3c88;
        color: white;
        padding: 18px 40px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .brand {
        font-size: 22px;
        font-weight: bold;
    }

    .nav-links {
        display: flex;
        gap: 18px;
    }

    .nav-links a {
        color: white;
        text-decoration: none;
    }

    .container {
        max-width: 750px;
        margin: 40px auto;
        padding: 0 20px;
    }

    .card {
        background: white;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
    }

    h1 {
        margin-bottom: 10px;
        color: #1f3c88;
    }

    .intro {
        color: #666;
        margin-bottom: 25px;
    }

    .form-group {
        margin-bottom: 20px;
    }

    label {
        display: block;
        font-weight: bold;
        margin-bottom: 8px;
    }

    input,
    textarea {
        width: 100%;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 15px;
        font-family: inherit;
    }

    textarea {
        resize: vertical;
    }

    input:focus,
    textarea:focus {
        outline: none;
        border-color: #1f3c88;
    }

    .errorlist {
        color: #b42318;
        margin-bottom: 10px;
        padding-left: 20px;
    }

    .button {
        display: inline-block;
        border: none;
        background: #1f3c88;
        color: white;
        padding: 12px 20px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 15px;
        text-decoration: none;
    }

    .button:hover {
        background: #162d68;
    }

    .secondary {
        background: #e9edf5;
        color: #1f3c88;
        margin-left: 8px;
    }
</style>


</head>

<body>


<nav class="navbar">

    <div class="brand">
        ELMCS
    </div>

    <div class="nav-links">
        <a href="{% url 'dashboard' %}">
            Dashboard
        </a>

        <a href="{% url 'logout' %}">
            Logout
        </a>
    </div>

</nav>


<main class="container">

    <div class="card">

        <h1>
            Submit a Request
        </h1>

        <p class="intro">
            Submit your request and the appropriate ELMCS officer
            will review it.
        </p>


        <form method="POST">

            {% csrf_token %}

            {{ form.non_field_errors }}


            <div class="form-group">

                {{ form.subject.errors }}

                <label for="{{ form.subject.id_for_label }}">
                    Subject
                </label>

                {{ form.subject }}

            </div>


            <div class="form-group">

                {{ form.description.errors }}

                <label for="{{ form.description.id_for_label }}">
                    Description
                </label>

                {{ form.description }}

            </div>


            <button type="submit" class="button">
                Submit Request
            </button>

            <a
                href="{% url 'my_requests' %}"
                class="button secondary"
            >
                My Requests
            </a>

        </form>

    </div>

</main>


</body>
</html>
