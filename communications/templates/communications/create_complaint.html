<!DOCTYPE html>
<html>
<head>

    <title>Submit Complaint | ELMCS</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #1f2937;
        }

        .page-container {
            max-width: 850px;
            margin: 0 auto;
            padding: 50px 24px;
        }

        .form-card {
            background: white;
            padding: 35px;
            border-radius: 14px;
            border: 1px solid #e5e7eb;
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.06);
        }

        .header {
            margin-bottom: 30px;
        }

        .header h1 {
            margin: 0 0 8px;
            font-size: 30px;
        }

        .header p {
            margin: 0;
            color: #6b7280;
        }

        form p {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            font-family: inherit;
        }

        input:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #2563eb;
        }

        textarea {
            resize: vertical;
        }

        .submit-button {
            width: 100%;
            border: none;
            padding: 13px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
        }

        .submit-button:hover {
            background: #1d4ed8;
        }

        .links {
            margin-top: 22px;
            display: flex;
            justify-content: space-between;
            gap: 15px;
        }

        .links a {
            text-decoration: none;
            color: #2563eb;
            font-weight: 600;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .errorlist {
            color: #dc2626;
            margin: 5px 0 10px;
            padding-left: 20px;
        }

        @media (max-width: 600px) {

            .page-container {
                padding: 25px 15px;
            }

            .form-card {
                padding: 25px 20px;
            }

            .links {
                flex-direction: column;
            }

        }

    </style>

</head>

<body>

<div class="page-container">

    <div class="form-card">

        <div class="header">

            <h1>Submit a Complaint</h1>

            <p>
                Tell us about an issue you would like to have reviewed.
            </p>

        </div>


        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="submit-button">
                Submit Complaint
            </button>

        </form>


        <div class="links">

            <a href="{% url 'my_complaints' %}">
                ← My Complaints
            </a>

            <a href="{% url 'dashboard' %}">
                Dashboard
            </a>

        </div>

    </div>

</div>

</body>
</html>
